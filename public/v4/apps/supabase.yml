captainVersion: 4
services:
    $$cap_appname-db:
        image: supabase/postgres:15.1.0.147
        restart: unless-stopped
        volumes:
            - $$cap_appname-db-data:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: $$cap_postgres_password
            POSTGRES_DB: postgres
            POSTGRES_USER: supabase_admin
            JWT_SECRET: $$cap_jwt_secret
            POSTGRES_HOST: /var/run/postgresql
        caproverExtra:
            notExposeAsWebApp: 'true'

    $$cap_appname-analytics:
        image: supabase/logflare:1.4.0
        restart: unless-stopped
        environment:
            LOGFLARE_NODE_HOST: 127.0.0.1
            DB_USERNAME: supabase_admin
            DB_DATABASE: postgres
            DB_HOSTNAME: srv-captain--$$cap_appname-db
            DB_PORT: '5432'
            DB_PASSWORD: $$cap_postgres_password
            DB_SCHEMA: _analytics
            LOGFLARE_PUBLIC_ACCESS_TOKEN: $$cap_logflare_public_token
            LOGFLARE_PRIVATE_ACCESS_TOKEN: $$cap_logflare_private_token
            LOGFLARE_SINGLE_TENANT: 'true'
            LOGFLARE_SUPABASE_MODE: 'true'
            LOGFLARE_MIN_CLUSTER_SIZE: '1'
            POSTGRES_BACKEND_URL: postgresql://supabase_admin:$$cap_postgres_password@srv-captain--$$cap_appname-db:5432/postgres
            POSTGRES_BACKEND_SCHEMA: _analytics
            LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true
        caproverExtra:
            notExposeAsWebApp: 'true'
        depends_on:
            - $$cap_appname-db

    $$cap_appname-kong:
        image: kong:2.8.1
        restart: unless-stopped
        environment:
            KONG_DATABASE: 'off'
            KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
            KONG_DNS_ORDER: LAST,A,CNAME
            KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
            KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
            KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
            SUPABASE_ANON_KEY: $$cap_anon_key
            SUPABASE_SERVICE_KEY: $$cap_service_role_key
            DASHBOARD_USERNAME: $$cap_dashboard_username
            DASHBOARD_PASSWORD: $$cap_dashboard_password
        caproverExtra:
            containerHttpPort: '8000'
            dockerfileLines:
                - FROM kong:2.8.1
                - RUN mkdir -p /var/lib/kong
                - >-
                    RUN printf 'services:\n
                    - name: auth-v1-open\n
                    \  url: http://srv-captain--$$cap_appname-auth:9999/verify\n
                    \  routes:\n
                    \  - name: auth-v1-open\n
                    \    strip_path: true\n
                    \    paths:\n
                    \    - /auth/v1/verify\n
                    \  plugins:\n
                    \  - name: cors\n
                    - name: auth-v1\n
                    \  url: http://srv-captain--$$cap_appname-auth:9999\n
                    \  routes:\n
                    \  - name: auth-v1-all\n
                    \    strip_path: true\n
                    \    paths:\n
                    \    - /auth/v1\n
                    \  plugins:\n
                    \  - name: cors\n
                    \  - name: key-auth\n
                    \    config:\n
                    \      hide_credentials: false\n
                    - name: rest-v1\n
                    \  url: http://srv-captain--$$cap_appname-rest:3000\n
                    \  routes:\n
                    \  - name: rest-v1-all\n
                    \    strip_path: true\n
                    \    paths:\n
                    \    - /rest/v1\n
                    \  plugins:\n
                    \  - name: cors\n
                    \  - name: key-auth\n
                    \    config:\n
                    \      hide_credentials: true\n
                    - name: realtime-v1\n
                    \  url: http://srv-captain--$$cap_appname-realtime:4000/socket\n
                    \  routes:\n
                    \  - name: realtime-v1-all\n
                    \    strip_path: true\n
                    \    paths:\n
                    \    - /realtime/v1\n
                    \  plugins:\n
                    \  - name: cors\n
                    \  - name: key-auth\n
                    \    config:\n
                    \      hide_credentials: false\n
                    - name: storage-v1\n
                    \  url: http://srv-captain--$$cap_appname-storage:5000\n
                    \  routes:\n
                    \  - name: storage-v1-all\n
                    \    strip_path: true\n
                    \    paths:\n
                    \    - /storage/v1\n
                    \  plugins:\n
                    \  - name: cors\n
                    - name: functions-v1\n
                    \  url: http://srv-captain--$$cap_appname-functions:8081\n
                    \  routes:\n
                    \  - name: functions-v1-all\n
                    \    strip_path: true\n
                    \    paths:\n
                    \    - /functions/v1\n
                    \  plugins:\n
                    \  - name: cors\n
                    \  - name: key-auth\n
                    \    config:\n
                    \      hide_credentials: false\n
                    - name: analytics-v1\n
                    \  url: http://srv-captain--$$cap_appname-analytics:4000\n
                    \  routes:\n
                    \  - name: analytics-v1-all\n
                    \    strip_path: true\n
                    \    paths:\n
                    \    - /analytics/v1\n
                    \  plugins:\n
                    \  - name: cors\n
                    \  - name: key-auth\n
                    \    config:\n
                    \      hide_credentials: false\n
                    - name: meta\n
                    \  url: http://srv-captain--$$cap_appname-meta:8080\n
                    \  routes:\n
                    \  - name: meta-all\n
                    \    strip_path: true\n
                    \    paths:\n
                    \    - /pg\n
                    \  plugins:\n
                    \  - name: key-auth\n
                    \    config:\n
                    \      hide_credentials: false\n
                    consumers:\n
                    - username: anon\n
                    \  keyauth_credentials:\n
                    \  - key: $$cap_anon_key\n
                    - username: service_role\n
                    \  keyauth_credentials:\n
                    \  - key: $$cap_service_role_key\n' > /var/lib/kong/kong.yml
                - EXPOSE 8000
                - CMD ["kong", "docker-start"]
        depends_on:
            - $$cap_appname-db
            - $$cap_appname-analytics

    $$cap_appname-auth:
        image: supabase/gotrue:v2.151.0
        restart: unless-stopped
        environment:
            GOTRUE_API_HOST: '0.0.0.0'
            GOTRUE_API_PORT: '9999'
            API_EXTERNAL_URL: https://$$cap_appname.$$cap_root_domain
            GOTRUE_DB_DRIVER: postgres
            GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:$$cap_postgres_password@srv-captain--$$cap_appname-db:5432/postgres
            GOTRUE_SITE_URL: $$cap_site_url
            GOTRUE_URI_ALLOW_LIST: $$cap_additional_redirect_urls
            GOTRUE_DISABLE_SIGNUP: 'false'
            GOTRUE_JWT_ADMIN_ROLES: service_role
            GOTRUE_JWT_AUD: authenticated
            GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
            GOTRUE_JWT_EXP: '3600'
            GOTRUE_JWT_SECRET: $$cap_jwt_secret
            GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
            GOTRUE_MAILER_AUTOCONFIRM: 'false'
            GOTRUE_SMTP_ADMIN_EMAIL: $$cap_smtp_admin_email
            GOTRUE_SMTP_HOST: $$cap_smtp_host
            GOTRUE_SMTP_PORT: $$cap_smtp_port
            GOTRUE_SMTP_USER: $$cap_smtp_user
            GOTRUE_SMTP_PASS: $$cap_smtp_pass
            GOTRUE_SMTP_SENDER_NAME: $$cap_smtp_sender_name
            GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
            GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
            GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
            GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
            GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
            GOTRUE_SMS_AUTOCONFIRM: 'false'
        caproverExtra:
            notExposeAsWebApp: 'true'
        depends_on:
            - $$cap_appname-db
            - $$cap_appname-analytics

    $$cap_appname-rest:
        image: postgrest/postgrest:v12.0.2
        restart: unless-stopped
        environment:
            PGRST_DB_URI: postgres://authenticator:$$cap_postgres_password@srv-captain--$$cap_appname-db:5432/postgres
            PGRST_DB_SCHEMAS: public,storage,graphql_public
            PGRST_DB_ANON_ROLE: anon
            PGRST_JWT_SECRET: $$cap_jwt_secret
            PGRST_DB_USE_LEGACY_GUCS: 'false'
            PGRST_APP_SETTINGS_JWT_SECRET: $$cap_jwt_secret
            PGRST_APP_SETTINGS_JWT_EXP: '3600'
        caproverExtra:
            notExposeAsWebApp: 'true'
        depends_on:
            - $$cap_appname-db

    $$cap_appname-realtime:
        image: supabase/realtime:v2.28.32
        restart: unless-stopped
        environment:
            PORT: '4000'
            DB_HOST: srv-captain--$$cap_appname-db
            DB_PORT: '5432'
            DB_USER: supabase_admin
            DB_PASSWORD: $$cap_postgres_password
            DB_NAME: postgres
            DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
            DB_ENC_KEY: $$cap_gen_random_hex(32)
            API_JWT_SECRET: $$cap_jwt_secret
            FLY_ALLOC_ID: fly123
            FLY_APP_NAME: realtime
            SECRET_KEY_BASE: $$cap_gen_random_hex(64)
            ERL_AFLAGS: -proto_dist inet_tcp
            ENABLE_TAILSCALE: 'false'
            DNS_NODES: "''"
        caproverExtra:
            notExposeAsWebApp: 'true'
        depends_on:
            - $$cap_appname-db

    $$cap_appname-storage:
        image: supabase/storage-api:v1.0.6
        restart: unless-stopped
        volumes:
            - $$cap_appname-storage-data:/var/lib/storage
        environment:
            ANON_KEY: $$cap_anon_key
            SERVICE_KEY: $$cap_service_role_key
            POSTGREST_URL: http://srv-captain--$$cap_appname-rest:3000
            PGRST_JWT_SECRET: $$cap_jwt_secret
            DATABASE_URL: postgres://supabase_storage_admin:$$cap_postgres_password@srv-captain--$$cap_appname-db:5432/postgres
            FILE_SIZE_LIMIT: '52428800'
            STORAGE_BACKEND: file
            FILE_STORAGE_BACKEND_PATH: /var/lib/storage
            TENANT_ID: stub
            REGION: stub
            GLOBAL_S3_BUCKET: stub
            ENABLE_IMAGE_TRANSFORMATION: 'true'
            IMGPROXY_URL: http://srv-captain--$$cap_appname-imgproxy:5001
        caproverExtra:
            notExposeAsWebApp: 'true'
        depends_on:
            - $$cap_appname-db
            - $$cap_appname-rest

    $$cap_appname-imgproxy:
        image: darthsim/imgproxy:v3.8.0
        restart: unless-stopped
        environment:
            IMGPROXY_BIND: ':5001'
            IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
            IMGPROXY_USE_ETAG: 'true'
            IMGPROXY_ENABLE_WEBP_DETECTION: 'true'
        volumes:
            - $$cap_appname-storage-data:/var/lib/storage
        caproverExtra:
            notExposeAsWebApp: 'true'

    $$cap_appname-meta:
        image: supabase/postgres-meta:v0.80.0
        restart: unless-stopped
        environment:
            PG_META_PORT: '8080'
            PG_META_DB_HOST: srv-captain--$$cap_appname-db
            PG_META_DB_PORT: '5432'
            PG_META_DB_NAME: postgres
            PG_META_DB_USER: supabase_admin
            PG_META_DB_PASSWORD: $$cap_postgres_password
        caproverExtra:
            notExposeAsWebApp: 'true'
        depends_on:
            - $$cap_appname-db

    $$cap_appname-functions:
        image: supabase/edge-runtime:v1.45.2
        restart: unless-stopped
        environment:
            JWT_SECRET: $$cap_jwt_secret
            SUPABASE_URL: http://srv-captain--$$cap_appname-kong:8000
            SUPABASE_ANON_KEY: $$cap_anon_key
            SUPABASE_SERVICE_ROLE_KEY: $$cap_service_role_key
            SUPABASE_DB_URL: postgresql://postgres:$$cap_postgres_password@srv-captain--$$cap_appname-db:5432/postgres
            VERIFY_JWT: 'true'
        caproverExtra:
            notExposeAsWebApp: 'true'
            containerHttpPort: '8081'
        depends_on:
            - $$cap_appname-db
            - $$cap_appname-analytics

    $$cap_appname-studio:
        image: supabase/studio:20240205-ce42139
        restart: unless-stopped
        environment:
            STUDIO_PG_META_URL: http://srv-captain--$$cap_appname-meta:8080
            POSTGRES_PASSWORD: $$cap_postgres_password
            DEFAULT_ORGANIZATION_NAME: $$cap_org_name
            DEFAULT_PROJECT_NAME: $$cap_appname
            SUPABASE_URL: http://srv-captain--$$cap_appname-kong:8000
            SUPABASE_PUBLIC_URL: https://$$cap_appname.$$cap_root_domain
            SUPABASE_ANON_KEY: $$cap_anon_key
            SUPABASE_SERVICE_KEY: $$cap_service_role_key
            AUTH_JWT_SECRET: $$cap_jwt_secret
            LOGFLARE_API_KEY: $$cap_logflare_public_token
            LOGFLARE_PUBLIC_ACCESS_TOKEN: $$cap_logflare_public_token
            LOGFLARE_PRIVATE_ACCESS_TOKEN: $$cap_logflare_private_token
            LOGFLARE_URL: http://srv-captain--$$cap_appname-analytics:4000
            NEXT_PUBLIC_ENABLE_LOGS: 'true'
            NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
        caproverExtra:
            containerHttpPort: '3000'
        depends_on:
            - $$cap_appname-kong
            - $$cap_appname-analytics

caproverOneClickApp:
    displayName: Supabase
    description: >-
        Open source Firebase alternative with PostgreSQL, Auth, instant APIs, Realtime, Storage,
        Edge Functions, Analytics (Logflare), and a web dashboard. Self-hosted on your own server.
    isOfficial: true
    documentation: https://supabase.com/docs/guides/self-hosting/docker
    instructions:
        start: |-
            ## Supabase — Self-Hosted (Full Stack)

            This deploys the **complete Supabase stack** on your server:
            - 🐘 **PostgreSQL** database with Supabase extensions
            - 🔐 **Auth** (GoTrue) — email/password, OAuth, magic links
            - ⚡ **REST API** (PostgREST) — auto-generated from your schema
            - 🔴 **Realtime** — WebSocket subscriptions
            - 🗄️ **Storage** — file uploads with image transformations
            - ⚙️ **Edge Functions** (Deno) — serverless TypeScript functions
            - 📊 **Analytics** (Logflare) — query logs and metrics
            - 🎛️ **Studio** — web dashboard for managing your project
            - 🌐 **Kong** — API gateway (your Supabase URL)

            **Important:** Generate your `ANON_KEY` and `SERVICE_ROLE_KEY` at:
            https://supabase.com/docs/guides/self-hosting#api-keys

            Use your `JWT_SECRET` when generating those keys.
        end: |-
            ## ✅ Supabase is deploying!

            It may take 3-5 minutes for all 11 services to start.

            **Your Supabase URL:** `https://$$cap_appname.$$cap_root_domain`
            **Studio Dashboard:** Enable HTTPS on the `$$cap_appname-studio` app, then visit it.
            **Edge Functions:** Deploy to `https://$$cap_appname.$$cap_root_domain/functions/v1/<function-name>`

            **SDK Configuration:**
            ```js
            import { createClient } from '@supabase/supabase-js'

            const supabase = createClient(
              'https://$$cap_appname.$$cap_root_domain',
              '$$cap_anon_key'
            )
            ```

            **Next steps:**
            1. Enable **HTTPS** on `$$cap_appname-kong` (your main API gateway)
            2. Enable **HTTPS** on `$$cap_appname-studio` (the dashboard)
            3. Enable **WebSocket** support on `$$cap_appname-realtime`
    variables:
        - id: $$cap_postgres_password
          label: Database | PostgreSQL Password
          description: Strong password for the PostgreSQL superuser. Auto-generated.
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /.{1,}/

        - id: $$cap_jwt_secret
          label: Auth | JWT Secret
          description: >-
              Secret used to sign JWT tokens. Must be at least 32 characters.
              Keep this safe — changing it will invalidate all existing sessions.
              Auto-generated.
          defaultValue: $$cap_gen_random_hex(40)
          validRegex: /.{32,}/

        - id: $$cap_anon_key
          label: Auth | Anon Key (JWT)
          description: >-
              Public API key for anonymous access. Generate at:
              https://supabase.com/docs/guides/self-hosting#api-keys
              using your JWT_SECRET above with role=anon, exp=never.
          defaultValue: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlhdCI6MTYxMzUzMTk4NSwiZXhwIjo0NzY5MjA1OTg1fQ.example-replace-me
          validRegex: /.{1,}/

        - id: $$cap_service_role_key
          label: Auth | Service Role Key (JWT)
          description: >-
              Secret API key with full database access. Generate at:
              https://supabase.com/docs/guides/self-hosting#api-keys
              using your JWT_SECRET above with role=service_role, exp=never.
          defaultValue: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNjEzNTMxOTg1LCJleHAiOjQ3NjkyMDU5ODV9.example-replace-me
          validRegex: /.{1,}/

        - id: $$cap_logflare_public_token
          label: Analytics | Logflare Public Access Token
          description: >-
              Token for public access to Logflare analytics (used by Studio for logs).
              Auto-generated — you can leave this as-is.
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /.{1,}/

        - id: $$cap_logflare_private_token
          label: Analytics | Logflare Private Access Token
          description: >-
              Token for private/admin access to Logflare analytics.
              Auto-generated — you can leave this as-is.
          defaultValue: $$cap_gen_random_hex(32)
          validRegex: /.{1,}/

        - id: $$cap_site_url
          label: App | Site URL
          description: The URL of your frontend application (used for auth redirects).
          defaultValue: http://localhost:3000
          validRegex: /.{1,}/

        - id: $$cap_additional_redirect_urls
          label: App | Additional Redirect URLs (optional)
          description: Comma-separated list of additional URLs allowed for auth redirects.
          defaultValue: ''

        - id: $$cap_org_name
          label: Studio | Organization Name
          description: Name of your organization shown in the Supabase Studio dashboard.
          defaultValue: My Organization
          validRegex: /.{1,}/

        - id: $$cap_dashboard_username
          label: Studio | Dashboard Username
          description: Username to log in to the Supabase Studio dashboard.
          defaultValue: admin
          validRegex: /.{1,}/

        - id: $$cap_dashboard_password
          label: Studio | Dashboard Password
          description: Password to log in to the Supabase Studio dashboard.
          defaultValue: $$cap_gen_random_hex(16)
          validRegex: /.{1,}/

        - id: $$cap_smtp_admin_email
          label: Email | Admin Email
          description: Admin email address for sending auth emails.
          defaultValue: admin@example.com

        - id: $$cap_smtp_host
          label: Email | SMTP Host
          description: SMTP server hostname for sending auth emails (e.g. smtp.sendgrid.net).
          defaultValue: ''

        - id: $$cap_smtp_port
          label: Email | SMTP Port
          description: SMTP server port (usually 587 for TLS or 465 for SSL).
          defaultValue: '587'

        - id: $$cap_smtp_user
          label: Email | SMTP Username
          description: SMTP username for authentication.
          defaultValue: ''

        - id: $$cap_smtp_pass
          label: Email | SMTP Password
          description: SMTP password for authentication.
          defaultValue: ''

        - id: $$cap_smtp_sender_name
          label: Email | Sender Name
          description: Display name for auth emails sent to users.
          defaultValue: Supabase
