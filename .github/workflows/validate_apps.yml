name: Validate One Click Apps

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

jobs:
    build:
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 20
            - run: npm ci && npm run validate_apps && npm run formatter
