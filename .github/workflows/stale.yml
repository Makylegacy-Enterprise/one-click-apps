# Stale Bot — Auto-close old issues and PRs
name: Stale Issues & PRs

on:
  schedule:
    - cron: '30 1 * * *'  # Run daily at 1:30 AM UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          # Issues
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
          close-issue-message: 'Closed due to inactivity. Feel free to reopen if still relevant.'
          exempt-issue-labels: 'pinned,security,bug'

          # Pull Requests
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had
            recent activity. It will be closed in 7 days if no further activity occurs.
          close-pr-message: 'Closed due to inactivity.'
          exempt-pr-labels: 'pinned,work-in-progress'
