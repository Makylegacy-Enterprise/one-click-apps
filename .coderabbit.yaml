# CodeRabbit Configuration
# AI-powered code reviews on every PR
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
language: "en"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
      - main

chat:
  auto_reply: true
